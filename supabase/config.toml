# Supabase CLI configuration (local development & `supabase link`).
project_id = "sales-tracker"

[api]
schemas = ["public"]
max_rows = 1000

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/reset-password", "https://*.vercel.app/reset-password"]
# Self-registration is disabled: accounts are created by administrators only.
enable_signup = false
jwt_expiry = 3600
enable_refresh_token_rotation = true

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true

[auth.rate_limit]
sign_in_sign_ups = 30

[functions.sheets-sync]
# Authenticates internally (admin JWT or scheduled-sync secret)
verify_jwt = false

[functions.admin-users]
verify_jwt = true
